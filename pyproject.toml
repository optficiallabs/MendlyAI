[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mendlyai"
version = "0.1.0"
description = "Open-source healthcare developer utilities for clinical data validation, secure workflows, testing, and release readiness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Optficial Labs Pvt Ltd."}
]
keywords = ["healthcare", "healthtech", "clinical-software", "testing", "security", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/optficiallabs/MendlyAI"
Repository = "https://github.com/optficiallabs/MendlyAI"
Issues = "https://github.com/optficiallabs/MendlyAI/issues"

[project.scripts]
mendlyai = "src.cli:main"

[tool.setuptools]
packages = ["src"]
